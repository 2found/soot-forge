name: Check packs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: npm ci --ignore-scripts
      - run: node --test scripts/*.test.mjs
      - run: node scripts/validate.mjs --remote
      # Do not execute contributor code on pull_request. Runner tests are a
      # trusted-main check, after source review; no secrets are available.
      - if: github.event_name == 'push'
        working-directory: packs/vibe_cf/runner
        run: go test -race ./...
      - if: github.event_name == 'push'
        working-directory: packs/health/runner
        run: go test -race ./...
