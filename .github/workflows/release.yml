name: Release packs
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: npm ci --ignore-scripts
      - run: node --test scripts/*.test.mjs
      - run: node scripts/validate.mjs --remote
      - run: node scripts/build.mjs "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packs
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Soot Forge $GITHUB_REF_NAME" --generate-notes
