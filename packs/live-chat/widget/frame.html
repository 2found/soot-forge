<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Soot Live chat</title>
  <link rel="stylesheet" href="/public/widget/widget.css">
</head>
<body>
<button id="launcher" aria-label="Mở hỗ trợ" aria-expanded="false" aria-controls="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z"/></svg></button>
<section id="chat" role="dialog" aria-modal="false" aria-labelledby="name" tabindex="-1" hidden>
  <header>
    <span id="logo" aria-hidden="true">S</span>
    <div class="identity"><strong id="name">Soot</strong><small id="activity" role="status">Đang kết nối…</small></div>
    <details id="options">
      <summary class="icon-button" aria-label="Tùy chọn cuộc trò chuyện"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary>
      <div class="menu"><button id="reset" type="button">Cuộc trò chuyện mới</button></div>
    </details>
    <button id="close" class="icon-button" aria-label="Thu gọn chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
  </header>
  <div id="reset-confirm" role="group" aria-labelledby="reset-title" hidden>
    <strong id="reset-title">Bắt đầu cuộc trò chuyện mới?</strong>
    <p>Cuộc trò chuyện hiện tại sẽ đóng. Nội dung chưa gửi sẽ được xóa.</p>
    <div class="confirm-actions"><button id="keep" type="button">Tiếp tục chat</button><button id="confirm-reset" type="button">Bắt đầu mới</button></div>
  </div>
  <div class="history">
    <div id="transcript" role="log" aria-live="polite" aria-relevant="additions" aria-label="Lịch sử trò chuyện" tabindex="0"><div id="welcome"><p id="greeting"></p><div id="quick" class="ui-agent-suggestions" role="group" aria-label="Gợi ý bắt đầu"></div></div><div id="working" class="working" aria-hidden="true" hidden><span class="working-dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="working-label" class="working-label"></span><span id="working-meta" class="working-meta" aria-hidden="true"></span></div></div>
    <button id="jump" class="ui-agent-jump" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg>Tin mới</button>
  </div>
  <div id="error-bar" hidden><p id="error" role="alert"></p><button id="retry" type="button" hidden>Thử lại</button></div>
  <div id="composer"></div>
  <footer>Được hỗ trợ bởi Soot</footer>
</section>
<script type="module" src="/public/widget/frame.js"></script>
</body>
</html>
